[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-os"
version = "0.6.0"
description = "A personal AI operating system"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
jarvis = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
