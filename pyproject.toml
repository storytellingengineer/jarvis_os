[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-os"
version = "0.1.0"
description = "A personal AI operating system"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
]

[project.scripts]
jarvis = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
